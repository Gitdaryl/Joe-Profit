<meta charset="utf-8">
<style>
  /* Soft bottom scrim so captions and the waveform stay legible over
     bright footage. No hard edge -- pure gradient. */
  html, body { margin:0; padding:0; background:transparent; }
  body { width:1080px; height:1920px; }
  .s {
    position:absolute; left:0; right:0; bottom:0; height:900px;
    background:linear-gradient(to bottom,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.28) 42%,
      rgba(0,0,0,0.58) 72%,
      rgba(0,0,0,0.72) 100%);
  }
</style>
<div class="s"></div>
